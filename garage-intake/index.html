<!doctype html>

<title>North Street Garage · Intake demo</title>
<style>

:root{--bg:#f2f3ef;--paper:#fff;--thread:#fbfcf9;--ink:#263c32;--muted:#758078;--line:#e1e5dc;--green:#315b46;--green-dark:#234532;--pale:#edf3e9;--amber:#76542a;--amber-bg:#fff2db;--red:#8b4030;--red-bg:#fff0ea}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button,a,input,textarea,select,summary{outline-offset:4px}

h1{font-size:30px;line-height:1.15;font-weight:620;letter-spacing:-.045em}
h2{font-size:17px;line-height:1.3;font-weight:650;letter-spacing:-.02em}
a{color:var(--green);text-underline-offset:3px}
button{color:inherit}

textarea{resize:vertical;min-height:96px;line-height:1.55}
input{min-height:44px}

button,a{touch-action:manipulation}
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--green);color:white;padding:11px 17px;border:1px solid var(--green);border-radius:8px;text-decoration:none;font-size:13px;font-weight:650;min-height:42px}
.button:hover{background:var(--green-dark)}

.button.compact{padding:8px 12px;min-height:36px;font-size:12px}

.chat-shell{max-width:780px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--thread);border-inline:1px solid var(--line)}

.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:28px 28px 30px;scroll-behavior:smooth}

.bubble-secondary{color:var(--muted);font-size:13px;margin-top:7px}

.photo-thumb{position:relative;width:92px;height:92px}
.photo-open{border:0;padding:0;border-radius:10px;overflow:hidden;width:100%;height:100%;cursor:zoom-in}
.photo-open img{width:100%;height:100%;object-fit:cover}

.proposal-response{margin:22px 0 20px 36px;max-width:440px}
.proposal-response>p{font-size:14px;margin-bottom:12px}
.proposal-response>.text-button{margin-left:15px}
.proposal-response>.fine-print{display:block;margin:12px 0}

.photo-dialog{max-width:min(90vw,900px);max-height:90dvh;border:0;background:#15261e;padding:38px 15px 15px;border-radius:12px;color:white}

.staff-brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650;text-decoration:none;color:var(--ink)}
.staff-header nav{display:flex;align-items:center;gap:20px;font-size:11px}

.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:27px}
.request-list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.request-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:23px 24px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.request-row:last-child{border-bottom:0}
.request-row:hover{background:#f9fbf5}
.request-row h2{font-size:16px}
.request-row p{font-size:12px;color:var(--muted);margin-top:6px}
.request-meta{display:flex;align-items:center;gap:15px;font-size:11px;color:var(--muted)}
.status-pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:5px;font-size:10px;background:#e9ede5;color:#65725e;white-space:nowrap}
.status-pill.accepted{color:var(--green);background:#e3eddb}
.status-pill.change_requested{color:var(--amber);background:var(--amber-bg)}
.status-pill.submitted{background:#e6ede1;color:var(--green)}
.empty-state{padding:38px 0}
.empty-state p{font-size:14px;color:var(--muted);margin:10px 0 20px}
.brief-page{max-width:860px}
.back-link{display:inline-block;font-size:11px;color:var(--muted);text-decoration:none;margin-bottom:24px}
.brief-heading{align-items:flex-start}
.vehicle-line{font-size:13px;color:var(--muted);margin-top:9px}
.vehicle-line span{margin:0 4px}
.contact-link{display:inline-block;font-size:12px;margin-top:7px;text-decoration:none}
.excluded-line{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:#59694f;margin-bottom:20px;padding:12px 14px;background:#eaf0e5;border-radius:7px;line-height:1.6}
.excluded-line svg{flex-shrink:0;margin-top:2px}
.triage-alert{margin:20px 0;background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:14px;font-size:13px}
.triage-alert p{font-size:12px;margin-top:4px}
.brief-list{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.brief-issue{padding:23px 24px;border-bottom:1px solid var(--line)}
.brief-issue:last-child{border-bottom:0}
.issue-heading{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.issue-heading .text-button{margin-left:auto}
.priority-number{color:#8b9588;font-size:12px}
.issue-heading h2{font-size:17px}
.symptom-summary{font-size:14px;line-height:1.65;color:#3f5042}
.issue-unknown{font-size:11px;color:var(--muted);margin-top:7px;margin-bottom:16px}
.decision-buttons{display:flex;flex-wrap:wrap;gap:5px}
.decision-buttons button{font-size:11px;padding:7px 10px;border:1px solid #e1e6da;background:#f8faf5;border-radius:5px;color:#77816e;min-height:33px}
.decision-buttons button.selected{background:#e6eedf;border-color:#bccdad;color:#38542d;font-weight:650}
.decision-buttons button:hover{border-color:#bccdad}
.visit-summary{margin:26px 0}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.section-heading h2{font-size:15px}
.visit-summary dl{margin:0;font-size:13px;display:grid;gap:12px}
.visit-summary dl>div{display:grid;grid-template-columns:105px 1fr;gap:15px}
.visit-summary dt{color:var(--muted);font-size:12px}
.visit-summary dd{margin:0;white-space:pre-wrap}
.issue-editor,.visit-editor{padding-top:5px}
.issue-editor textarea{min-height:90px}
.editor-pair{display:grid;grid-template-columns:110px 1fr;gap:14px}
.issue-editor .button,.visit-editor .button{margin-top:15px}
.save-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin:20px 0}
.next-step{border-top:1px solid var(--line);padding-top:25px;margin-top:28px}
.next-step textarea{min-height:265px;border-radius:10px;padding:16px;font-size:13px}
.proposal-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:12px}
.proposal-footer>span{font-size:11px;color:var(--muted)}
.save-feedback{color:var(--green);font-size:12px;margin-top:15px}
.customer-response{border-left:3px solid #90aa7a;padding:15px 17px;background:#eaf1e4;border-radius:0 8px 8px 0;margin:24px 0;font-size:14px}
.customer-response .eyebrow{margin-bottom:7px}
.source-conversation{margin-top:32px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.source-conversation summary{cursor:pointer}
.source-conversation>div{margin:20px 0;max-width:600px}
.source-conversation span{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.source-conversation p{white-space:pre-wrap;margin-top:6px;color:var(--ink);font-size:13px}
.brief-photos{margin-top:24px}
.brief-photos h2{font-size:14px;margin-bottom:12px}
.brief-photos>div{display:flex;gap:12px;flex-wrap:wrap}
.brief-photos button{border:0;background:none;padding:0;cursor:zoom-in;text-align:left}
.brief-photos img{width:120px;height:85px;object-fit:cover;border-radius:8px}
.brief-photos span{display:block;font-size:10px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.login-page{max-width:360px;margin:12vh auto;padding:25px}
.login-page h1{font-size:27px;margin-top:25px}
.login-page>p{font-size:13px;color:var(--muted);margin-top:10px}
.login-page form{margin-top:25px}
.login-page .button{width:100%;margin-top:18px}
.simple-page{max-width:500px;margin:12vh auto;padding:24px}
.simple-page p{margin:15px 0 25px;color:var(--muted)}
.demo-intro{font-size:14px;color:var(--muted);max-width:600px;margin-top:12px}
.demo-actions{display:flex;flex-wrap:wrap;gap:12px;margin:25px 0 40px}
.demo-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}

.sms-section{border-top:1px solid var(--line);padding-top:27px}

<script>
// BEGIN INTAKE PROVIDER
const IntakeProvider = (() => {

// Channel-independent mock provider. No model API is used.
// Replace this module's start/answer/revise contract with a model adapter later.
const SCENARIO = "Loads of warning lights came on yesterday. My boot doesn’t stay up properly. There’s also a knocking noise I’ve been meaning to get checked. My MOT and service are due in November, but I want Skoda to do those because the car has a full Skoda service history.";

const QUESTIONS = {
  lights: {
    key:"lights",
    text:"Are any lights red or flashing, or has braking or steering changed?",
    example:"Amber ABS, ESC and tyre pressure lights. No red or flashing lights. Braking and steering feel normal.",
    choices:[
      {label:"Amber only, drives normally",value:"Only amber lights. Braking and steering feel normal."},
      {label:"Red / flashing, or driving changed",value:"There are red or flashing lights, or braking or steering has changed."},
      {label:"Not sure",value:"I'm not sure which lights they are or whether driving has changed."}
    ]
  },
  knock: {
    key:"knock",text:"When do you hear the knocking?",
    example:"At the front, over bumps. It's been happening for about two months and is getting louder.",
    choices:[
      {label:"Over bumps",value:"I hear it over bumps."},
      {label:"When turning",value:"I hear it when turning."},
      {label:"When braking",value:"I hear it when braking."},
      {label:"Not sure",value:"I'm not sure when it happens."}
    ]
  },
  other: {
    key:"other",text:"When does it happen, and how does it affect the car?",
    example:"It happens most days. I'm not sure what causes it.",
    choices:[{label:"Not sure",value:"I'm not sure."}]
  },
  availability: {
    key:"availability",text:"When could you leave the car with us?",
    example:"Tuesday or Thursday morning, until 3 pm. I need it for school runs and would like help as soon as practical.",
    choices:[]
  },
  forgotten: {
    key:"forgotten",text:"Anything else you've been putting off, or anything we should work around?",
    example:"Nothing else. Please quote before doing repairs.",

      {label:"Please quote before repairs",value:"Nothing else. Please quote before doing repairs."}
    ]

};

const normalise = text => text.toLowerCase().replace(/[’‘]/g,"'");
const sentenceList = text => text.match(/[^.!?]+[.!?]?/g) || [text];

function triage(text) {
  let t=normalise(text);
  t=t.replace(/\b(?:no|not|aren't|isn't|without)\s+(?:any\s+)?(?:red|flashing)(?:\s+(?:or|and)\s+(?:red|flashing))?(?:\s+lights?)?/g,"");
  if(/\bred\b|\bflashing\b|(?:brak(?:e|es|ing)|steering).{0,30}(?:changed|worse|fail|heavy|different)|(?:lost|losing) power|overheat/.test(t))return "urgent";
  if(/amber|yellow/.test(t)&&/normal|unchanged|no change|fine/.test(t))return "reported-normal";
  return "unknown";
}

function extractIssues(text) {
  const sentences=sentenceList(text);
  const definitions=[
    {id:"lights",test:/warning|dashboard|\babs\b|\besc\b|engine light/i,title:"Warning lights",type:"diagnosis"},
    {id:"knock",test:/knock|clunk|rattl/i,title:"Knocking noise",type:"diagnosis"},
    {id:"boot",test:/boot|tailgate/i,title:/stay|drop|fall|hold|support/i.test(text)?"Boot won't stay open":"Boot / tailgate problem",type:"inspect-and-quote"},
    {id:"aircon",test:/air conditioning|air con\b|a\/c/i,title:"Air conditioning concern",type:"diagnosis"}
  ];
  const issues=definitions.filter(d=>d.test.test(text)).map((d,index)=>({
    id:d.id,title:d.title,priority:index+1,
    symptoms:sentences.filter(s=>d.test.test(s)).map(s=>s.trim()),
    onset:d.id==="lights"&&/yesterday/i.test(text)?"Yesterday":"Not confirmed",
    workType:d.type,urgency:d.id==="lights"?"Prompt safety review":"Review at visit",
    uncertainties:[d.id==="boot"?"Required repair unconfirmed":"Cause unconfirmed"],
    decision:d.id==="boot"?"quote":"investigate"
  }));
  return issues.length?issues:[{
    id:"other",title:"Customer concern",priority:1,symptoms:[text],
    onset:"Not confirmed",workType:"diagnosis",urgency:"Not confirmed",
    uncertainties:["Symptoms and cause need clarification"],decision:"investigate"
  }];
}

function extractExclusions(text) {
  const t=normalise(text);
  const reserved=/want\s+(?:skoda|škoda|(?:the\s+)?dealer)|(?:skoda|škoda|dealer).{0,40}(?:do those|do them|service history)|keep.{0,40}(?:skoda|škoda|dealer)/.test(t);
  return reserved?[...(/\bmot\b/.test(t)?["MOT"]:[]),...(/\bservice\b/.test(t)?["Service"]:[])]:[];
}
function message(data,role,text) {
  data.messages.push({id:globalThis.crypto.randomUUID(),role,text,at:new Date().toISOString()});
}
function addMessage(data,role,text){message(data,role,text);}
function nextQuestion(data) {
  if(data.issues.some(i=>i.id==="lights")&&!data.answers.lights)return QUESTIONS.lights;
  if(data.issues.some(i=>i.id==="knock")&&!data.answers.knock)return QUESTIONS.knock;
  if(data.issues.some(i=>i.id==="other"||i.id==="aircon")&&!data.answers.other)return QUESTIONS.other;
  if(!data.answers.availability)return QUESTIONS.availability;
  if(!data.answers.forgotten)return QUESTIONS.forgotten;
  return null;
}
function advance(data) {
  const q=nextQuestion(data);
  data.questionKey=q?.key||null;
  if(q){data.stage="questions";message(data,"assistant",q.text);}
  else {
    data.stage="contact";
    message(data,"assistant","Where should we send the garage's reply?");
  }
}
function addDetails(data,key,text) {
  const issue=data.issues.find(i=>i.id===key)||(key==="other"?data.issues.find(i=>i.id==="aircon"):null);
  if(!issue)return;
  issue.symptoms.push(text);
  if(key==="lights"){
    const reported=triage(text);
    if(data.safety!=="urgent")data.safety=reported;
    issue.urgency=data.safety==="urgent"?"Contact before driving":"Prompt safety review";
    issue.uncertainties=["Cause unconfirmed; lights and driving behaviour are customer reports"];
  }
  if(key==="knock"){
    const age=text.match(/(?:for|about)\s+(?:about\s+)?(\w+\s+(?:days?|weeks?|months?|years?))/i);
    if(age)issue.onset=age[1];
  }
}
function start(text,source="website") {
  const excluded=extractExclusions(text);
  const data={
    version:1,source,stage:"questions",status:"draft",original:text,
    vehicle:{description:/skoda|škoda/i.test(text)?"Škoda · model not confirmed":"Vehicle not confirmed",registration:""},
    customer:{name:"",mobile:""},issues:extractIssues(text),
    preferences:{availability:"",urgency:"Not stated",constraints:"",
      approval:"Quote before repairs. No repair work authorised.",
      excludedWork:excluded,
      exclusionReason:excluded.length?"Customer wants Škoda to retain their full dealer service history.":""
    },
    answers:{},questionKey:null,safety:triage(text),photos:[],messages:[],proposal:null
  };
  message(data,"customer",text);
  const labels=data.issues.map(i=>i.title.toLowerCase());
  const listed=labels.length>1?labels.slice(0,-1).join(", ")+" and "+labels.at(-1):labels[0];
  message(data,"assistant","I've noted "+listed+"."+
    (excluded.length?" Your MOT and service are staying with Škoda.":""));
  // Skip details explicitly supplied in the opening; keep unresolved causes.
  if(data.issues.some(i=>i.id==="lights")&&/amber|yellow|red|flashing/i.test(text)&&/brak|steer/i.test(text))data.answers.lights=text;
  if(data.issues.some(i=>i.id==="knock")&&/over bumps|when turning|when braking/i.test(text))data.answers.knock=text;
  if(data.safety==="urgent")message(data,"assistant","Please contact the garage before driving. Stop as soon as safe if warning lights are red or flashing, or braking or steering has changed. Discuss recovery if needed.");
  advance(data);
  return data;
}
function answer(data,text) {
  if(data.stage!=="questions"||!data.questionKey)throw new Error("No question is waiting for an answer.");
  const key=data.questionKey;
  data.answers[key]=text;
  message(data,"customer",text);
  addDetails(data,key,text);
  if(key==="lights"&&data.safety==="urgent")message(data,"assistant","Please contact the garage before driving. Stop as soon as safe if warning lights are red or flashing, or braking or steering has changed. Discuss recovery if needed.");
  if(key==="availability"){
    data.preferences.availability=text;
    if(/as soon|urgent|today|tomorrow|soon|this week/i.test(text))data.preferences.urgency=text;
    if(/school|work|budget|cost|leave|need|call|quote/i.test(text))data.preferences.constraints=text;
  }
  if(key==="forgotten"){
    data.preferences.constraints=[data.preferences.constraints,text].filter(Boolean).join("\n");
    if(!/^(nothing|no\b|none|not\b|that'?s everything)/i.test(text)){
      const found=extractIssues(text);
      const preferenceOnly=found.length===1&&found[0].id==="other"&&/quote|approval|before repairs|call me|budget|school runs/i.test(text);
      if(!preferenceOnly)addConcerns(data,text);
    }
  }
  advance(data);
  return data;
}
function addConcerns(data,text) {
  for(const extra of extractIssues(text)){
    const existing=data.issues.find(i=>i.id===extra.id);
    if(existing)existing.symptoms.push(text);
    else { extra.priority=data.issues.length+1;extra.id=extra.id==="other"?"additional-"+data.issues.length:extra.id;data.issues.push(extra); }
  }

function revise(data,text) {
  if(data.stage!=="review"||data.status!=="draft")throw new Error("This draft is not ready for changes.");
  message(data,"customer",text);
  // Deliberately conservative: retain the customer's correction as evidence.
  // A model adapter will later interpret arbitrary changes across fields.
  addConcerns(data,text);
  message(data,"assistant","I've added that detail to the request for the garage to review.");
  return data;
}
function setContact(data,customer,vehicle) {
  if(data.stage!=="contact")throw new Error("Contact details aren't needed yet.");
  data.customer=customer;
  data.vehicle={description:vehicle.description||data.vehicle.description,registration:vehicle.registration||""};
  data.stage="review";
  message(data,"assistant","Ready to send: "+data.issues.length+" separate concerns"+
    (data.preferences.excludedWork.length?", with "+data.preferences.excludedWork.join(" and ")+" excluded":"")+
    ". You can add anything we've missed below.");
  return data;
}
function submit(data) {
  if(data.stage!=="review"||data.status!=="draft")throw new Error("This intake isn't ready to send.");
  data.stage="submitted";data.status="submitted";
  message(data,"assistant","Your request is with the garage. They'll review it and propose a next step. An appointment and any charges still need confirming.");
  return data;
}
function draftProposal(data) {
  const verbs={
    investigate:i=>"Investigate "+i.title.toLowerCase()+" and confirm the cause.",
    quote:i=>"Inspect "+i.title.toLowerCase()+" and provide a repair quote.",
    later:i=>"Discuss a later visit for "+i.title.toLowerCase()+".",
    none:i=>"Take no action on "+i.title.toLowerCase()+" for this request."
  };
  const safety=data.issues.some(i=>i.id==="lights"||i.id==="knock")
    ?"Please contact us before bringing the car in so we can discuss driving safety. ":"";
  return "Hi "+(data.customer.name.split(" ")[0]||"there")+",\n\nHere's our proposed next step:\n\n"+
    [...data.issues].sort((a,b)=>a.priority-b.priority).map(i=>"• "+verbs[i.decision](i)).join("\n")+
    (data.preferences.excludedWork.length?"\n\n"+data.preferences.excludedWork.join(" and ")+" remain outside this request.":"")+
    "\n\n"+safety+"We'll confirm an appointment that works with your availability and agree any diagnostic charge before starting. We'll ask for approval before repairs.";
}
function completeDemo() {

  setContact(data,{name:"Sam Taylor",mobile:"07700900123"},{description:"2016 Škoda Octavia estate",registration:"SK16 ODA"});
  submit(data);
  return data;

return {SCENARIO,QUESTIONS,triage,extractIssues,extractExclusions,addMessage,nextQuestion,start,answer,revise,setContact,submit,draftProposal,completeDemo};
})();

  const n=state.notification;
  return staffHeader()+'<main class="staff-page brief-page"><div class="eyebrow">Simulated notification</div><h1>A way back to the conversation.</h1>'+
    '<p class="demo-intro">This is a preview of what the customer would receive. No SMS is sent.</p>'+
    (n?'<div class="sms-list"><article class="sms-card"><div class="sms-card-top"><span>Example recipient: '+e(state.intake.customer.mobile)+'</span><span>SMS preview</span></div><p>North Street Garage has proposed a next step for your car.</p><a class="button" href="'+returnPath()+'">Open customer conversation '+icon("arrow",16)+'</a><p class="fine-print" style="margin-top:15px">This return link uses the demo saved in this browser.</p></article></div>':
    '<div class="empty-state"><p>Send a next step from the Garage view to create a notification.</p><button class="button secondary" data-action="garage">Open garage</button></div>')+'</main>';
}
function resizeComposer(){
  const box=$("#composer");
  if(box){box.style.height="auto";box.style.height=Math.min(box.scrollHeight,180)+"px";}
}
function render(){
  const {view}=route();
  document.querySelectorAll("[data-nav]").forEach(b=>{
    const selected=b.dataset.nav===view;b.classList.toggle("active",selected);b.setAttribute("aria-current",selected?"page":"false");
  });
  $("#notification-dot").hidden=!state.notification||state.intake?.status!=="proposed";
  $("#app").innerHTML=view==="garage"?garage():view==="notification"?notification():customer();
  resizeComposer();
  if(view==="customer")requestAnimationFrame(()=>$("#thread-bottom")?.scrollIntoView({block:"end",behavior:"instant"}));
  else window.scrollTo(0,0);
}
function send(text){
  if(!text.trim())return;
  if(!state.intake){
    state.id=uuid();state.intake=IntakeProvider.start(text.trim(),"demo");
    state.intake.photos=pendingPhotos.map(p=>({...p,issueId:null}));pendingPhotos=[];
  }else if(state.intake.stage==="questions")IntakeProvider.answer(state.intake,text.trim());
  else if(state.intake.stage==="review")IntakeProvider.revise(state.intake,text.trim());
  compose="";feedback="";save();
  if(route().id!==state.id)go("customer",state.id);else render();
}
function restart(){
  state={version:1,id:null,intake:null,notification:null};compose=IntakeProvider.SCENARIO;
  pendingPhotos=[];proposalDraft="";proposalEdited=false;editing=null;visitEditing=false;feedback="";
  try{localStorage.removeItem(KEY);}catch{}
  go("customer");
}
document.addEventListener("click",event=>{
  const button=event.target.closest("[data-action]");if(!button)return;
  const action=button.dataset.action,id=button.dataset.id,value=button.dataset.value;
  if(["customer","garage","notification"].includes(action)){feedback="";go(action,action==="customer"?state.id:null);}
  if(action==="quick")send(value);
  if(action==="restart"&&(!state.intake||window.confirm("Clear this demo and start again?")))restart();
  if(action==="completed"){
    if(state.intake&&!window.confirm("Replace the current demo with the completed example?"))return;
    state={version:1,id:uuid(),intake:IntakeProvider.completeDemo(),notification:null};
    proposalDraft="";proposalEdited=false;compose="";feedback="Completed example loaded.";save();go("garage");
  }
  if(action==="submit"){
    if(compose.trim()){feedback="Send your extra detail first, or clear it before sending the request.";render();return;}
    IntakeProvider.submit(state.intake);feedback="";save();render();
  }
  if(action==="decision"){
    state.intake.issues.find(i=>i.id===id).decision=value;
    if(!proposalEdited)proposalDraft=IntakeProvider.draftProposal(state.intake);
    save();render();
  }
  if(action==="edit"){editing=editing===id?null:id;render();}
  if(action==="visit"){visitEditing=!visitEditing;render();}
  if(action==="draft"){proposalDraft=IntakeProvider.draftProposal(state.intake);proposalEdited=false;render();}
  if(action==="change"){
    $("#change-form").hidden=!$("#change-form").hidden;$("#change-message").focus();
  }
  if(action==="accept"){
    const d=state.intake;
    if(d.status!=="proposed")return;
    d.status="accepted";d.proposal.status="accepted";d.proposal.response="I've accepted the proposed next step.";
    IntakeProvider.addMessage(d,"customer",d.proposal.response);
    IntakeProvider.addMessage(d,"assistant","Thank you. The garage still needs to confirm an appointment and any charges. No repairs are authorised.");
    save();render();
  }
  if(action==="remove-photo"){
    if(state.intake)state.intake.photos=state.intake.photos.filter(p=>p.id!==id);
    else pendingPhotos=pendingPhotos.filter(p=>p.id!==id);
    save();render();
  }
  if(action==="photo"){
    const p=(state.intake?.photos||pendingPhotos).find(p=>p.id===id);
    $("#photo-content").innerHTML='<button class="lightbox-close" data-action="close-photo" aria-label="Close photo">'+icon("close")+'</button><img src="'+e(p.dataUrl)+'" alt="'+e(p.name)+'"><p>'+e(p.name)+'</p>';
    $("#photo-dialog").showModal();
  }
  if(action==="close-photo")$("#photo-dialog").close();
});
document.addEventListener("submit",event=>{
  const form=event.target.closest("[data-form]");if(!form)return;event.preventDefault();
  const values=Object.fromEntries(new FormData(form));
  const kind=form.dataset.form;
  if(kind==="message"){send(values.text);return;}
  if(kind==="contact"){
    if(values.mobile.replace(/\D/g,"").length<7){feedback="Please use the example number or add a mobile number.";render();return;}
    IntakeProvider.setContact(state.intake,{name:values.name.trim(),mobile:values.mobile.trim()},{registration:values.registration.trim().toUpperCase(),description:values.description.trim()});
  }
  if(kind==="issue"){
    const issue=state.intake.issues.find(i=>i.id===form.dataset.id);
    issue.title=values.title.trim();issue.symptoms=values.symptoms.split("\n").map(s=>s.trim()).filter(Boolean);
    issue.uncertainties=values.unknown.split("\n").map(s=>s.trim()).filter(Boolean);editing=null;
  }
  if(kind==="visit"){
    Object.assign(state.intake.preferences,{availability:values.availability.trim(),constraints:values.constraints.trim(),excludedWork:values.excluded.split(",").map(s=>s.trim()).filter(Boolean)});
    visitEditing=false;if(!proposalEdited)proposalDraft=IntakeProvider.draftProposal(state.intake);
  }
  if(kind==="proposal"){
    if(editing||visitEditing){feedback="Save or cancel the open edits first.";render();return;}
    const text=values.proposal.trim();if(!text)return;
    state.intake.proposal={id:uuid(),text,status:"pending",response:"",sentAt:new Date().toISOString(),decisions:state.intake.issues.map(i=>({issueId:i.id,decision:i.decision}))};
    state.intake.status="proposed";IntakeProvider.addMessage(state.intake,"garage",text);
    state.notification={requestId:state.id,body:text,returnURL:fullReturnURL()};
    proposalDraft=text;proposalEdited=true;feedback="Next step ready. Open the simulated notification to return as the customer.";
  }
  if(kind==="change"){
    const d=state.intake,text=values.change.trim();if(!text||d.status!=="proposed")return;
    d.status="change_requested";d.proposal.status="change_requested";d.proposal.response=text;
    IntakeProvider.addMessage(d,"customer",text);IntakeProvider.addMessage(d,"assistant","Your change request is with the garage.");
  }
  save();render();
});
document.addEventListener("input",event=>{
  if(event.target.id==="composer"){
    compose=event.target.value;resizeComposer();$(".send-button").disabled=!compose.trim();
  }
  if(event.target.id==="proposal"){proposalDraft=event.target.value;proposalEdited=true;}
});
document.addEventListener("keydown",event=>{
  if(event.target.id==="composer"&&event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();send(event.target.value);}
});
document.addEventListener("change",async event=>{
  if(event.target.id!=="upload")return;
  const files=Array.from(event.target.files);event.target.value="";
  const current=state.intake?.photos||pendingPhotos;
  if(current.length+files.length>3){feedback="You can attach up to 3 photos.";render();return;}
  const prepared=[];
  for(const file of files){
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>1024*1024){
      feedback="Choose a JPG, PNG or WebP photo under 1 MB.";render();return;
    }
    try{
      const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
      prepared.push({id:uuid(),name:file.name,dataUrl,issueId:null});
    }catch{feedback="That photo couldn't be opened. Please try another.";render();return;}
  }
  current.push(...prepared);feedback="";save();render();
});
$("#photo-dialog").addEventListener("click",event=>{if(event.target===$("#photo-dialog"))$("#photo-dialog").close();});
window.addEventListener("hashchange",()=>{feedback="";render();});
window.addEventListener("storage",event=>{
  if(event.key!==KEY)return;
  try{const fresh=JSON.parse(event.newValue||"null");if(fresh?.version===1){state=fresh;render();}}catch{}
});
render();

</script>
</body>
</html>
