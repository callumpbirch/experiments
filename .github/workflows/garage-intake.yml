name: Check simple garage demo
on:
  push:
    branches: [garage-intake-prototype]
    paths: ['garage-intake/**', '.github/workflows/garage-intake.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check intake logic
        run: node --test garage-intake/tests/*.test.mjs
      - name: Install browser for automated checks
        run: npm install --prefix "$RUNNER_TEMP/garage-demo-checks" playwright
      - name: Prepare browser
        run: '"$RUNNER_TEMP/garage-demo-checks/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Check downloadable and hosted demo
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/garage-demo-checks
          DEMO_URL: https://raw.githack.com/callumpbirch/experiments/${{ github.sha }}/garage-intake/index.html
        run: node garage-intake/scripts/check-demo.mjs
